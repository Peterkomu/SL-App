        kenteken: "", trailernr: "", simonLoosTrailerNr: "", tabletBoco: "",
        begintijd: "", eindtijd: "", pauze: "", kmBegin: "", kmEind: "",
        tolkosten: "", kostenOverig: "", bijzonderheden: ""
      };
      state.stops = [emptyStop()];
      state.success = false;
      state.error = "";
      render();
    }

    function submit() {
      state.error = "";
      if (!state.header.chauffeur) { state.error = t("err_chauffeur"); render(); return; }
      if (!state.header.datum) { state.error = t("err_datum"); render(); return; }
      if (SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
        state.error = t("err_koppeling");
        render(); return;
      }

      state.submitting = true; render();

      fetch(SCRIPT_URL, {
        method: "POST",
        // Apps Script web apps accept simple requests; text/plain avoids a CORS preflight.
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ header: state.header, stops: state.stops })
      })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.submitting = false;
        if (data && data.ok) {
          // Snapshot exactly what was submitted, so the PDF matches
          // even after the form is reset.
          state.lastSubmitted = {
            header: JSON.parse(JSON.stringify(state.header)),
            stops: JSON.parse(JSON.stringify(state.stops))
          };
          state.success = true;
        } else {
          state.error = (data && data.error) || t("err_algemeen");
        }
        render();
      })
      .catch(function (err) {
        state.submitting = false;
        state.error = t("err_verzenden");
        render();
      });
    }

    // ---- Rendering (plain DOM, no framework) ----
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          if (k === "class") node.className = attrs[k];
          else if (k === "value") node.value = attrs[k];
          else if (k === "checked") node.checked = attrs[k];
          else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        });
      }
      (children || []).forEach(function (c) {
        if (c == null) return;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return node;
    }

    // Language selector pills — shown at the top on every screen.
    function renderLangBar(app) {
      var bar = el("div", { class: "lang-bar" }, LANG_ORDER.map(function (code) {
        return el("div", {
          class: "lang-btn" + (currentLang === code ? " active" : ""),
          onclick: function () { setLanguage(code); }
        }, [ LANG_NAMES[code] ]);
      }));
      app.appendChild(bar);
    }

    function inputField(label, key, type) {
      return el("div", { class: "field" }, [
        el("label", null, [label]),
        el("input", {
          type: type || "text",
          value: state.header[key] || "",
          oninput: function (e) { state.header[key] = e.target.value; updateComputed(); }
        })
      ]);
    }

    function render() {
      var app = document.getElementById("app");
      app.innerHTML = "";

      // Language selector is always available (before, during, and after entry).
      renderLangBar(app);

      if (state.success) {
        app.appendChild(el("div", { class: "success-screen" }, [
          el("div", { class: "checkmark" }, ["\u2713"]),
          el("h2", null, [t("successTitle")]),
          el("p", null, [t("successMsg")]),
          el("button", { class: "btn-submit", onclick: function () { downloadPdf(state.lastSubmitted); } }, [t("downloadPdf")]),
          el("button", { class: "btn-secondary", onclick: resetForm }, [t("nieuweDagstaat")])
        ]));
        return;
      }

      app.appendChild(el("div", { class: "brand" }, [
        el("h1", null, [t("brand")]),
        el("span", null, ["Simon Loos"])
      ]));

      if (state.error) {
        app.appendChild(el("div", { class: "error-banner" }, [state.error]));
      }

      // --- Gegevens card ---
      var driverField = el("div", { class: "field" }, [
        el("label", null, [t("naamChauffeur")]),
        el("input", {
          type: "text",
          value: state.header.chauffeur,
          placeholder: t("p_naam"),
          oninput: function (e) { state.header.chauffeur = e.target.value; }
        })
      ]);

      app.appendChild(el("div", { class: "card" }, [
        el("h2", null, [t("gegevens")]),
        inputField(t("charterSubco"), "charterSubco"),
        el("div", { class: "row2" }, [ inputField(t("datum"), "datum", "date"), inputField(t("kenteken"), "kenteken") ]),
        driverField,
        el("div", { class: "row2" }, [
          inputField(t("personeelsnummer"), "personeelsnummer"),
          el("div", { class: "field" }, [
            el("label", null, [t("tabletBoco")]),
            el("div", { class: "radio-group" }, [
              radio("tabletBoco", "Ja", t("ja")), radio("tabletBoco", "Nee", t("nee"))
            ])
          ])
        ]),
        el("div", { class: "row2" }, [
          inputField(t("trailernr"), "trailernr"),
          inputField(t("simonLoosTrailerNr"), "simonLoosTrailerNr")
        ])
      ]));

      // --- Diensttijd card ---
      var uren = computeUren(state.header.begintijd, state.header.eindtijd, state.header.pauze);
      var diensttijdChildren = [
        el("h2", null, [t("diensttijd")]),
        el("div", { class: "row2 row-datetime" }, [
          inputField(t("begintijd"), "begintijd", "datetime-local"),
          inputField(t("eindtijd"), "eindtijd", "datetime-local")
        ]),
        pauzeField()
      ];
      if (uren.bruto !== "" || uren.netto !== "") {
        diensttijdChildren.push(el("div", { class: "computed", id: "urenBox" }, [
          t("brutoUren") + ": " + (uren.bruto || "-") + "  |  " + t("nettoUren") + ": " + (uren.netto || "-")
        ]));
      }
      app.appendChild(el("div", { class: "card" }, diensttijdChildren));

      // --- Kilometers card ---
      var kmTot = computeKm(state.header.kmBegin, state.header.kmEind);
      var kmChildren = [
        el("h2", null, [t("kilometers")]),
        el("div", { class: "row2" }, [
          inputField(t("kmBegin"), "kmBegin", "number"),
          inputField(t("kmEind"), "kmEind", "number")
        ])
      ];
      if (kmTot !== "") {
        kmChildren.push(el("div", { class: "computed", id: "kmBox" }, [t("kmTotaal") + ": " + kmTot]));
      }
      kmChildren.push(el("div", { class: "row2" }, [
        inputField(t("tolkosten"), "tolkosten", "number"),
        inputField(t("kostenOverig"), "kostenOverig", "number")
      ]));
      app.appendChild(el("div", { class: "card" }, kmChildren));

      // --- Stops card ---
      var stopCards = [ el("h2", null, [t("laadLosstops")]) ];
      state.stops.forEach(function (stop, i) {
        var headerRow = el("div", { class: "stop-card-header" }, [
          el("strong", null, [t("stop") + " " + (i + 1)]),
          state.stops.length > 1
            ? el("button", { type: "button", class: "btn-remove", onclick: function () { removeStop(i); } }, [t("verwijderen")])
            : null
        ]);
        stopCards.push(el("div", { class: "stop-card" }, [
          headerRow,
          stopField(i, t("twNr"), "twNr"),
          stopField(i, t("laadLosLocatie"), "laadLosLocatie"),
          el("div", { class: "row3 row-datetime" }, [
            stopField(i, t("aankomst"), "aankomst", "datetime-local"),
            stopField(i, t("startLadenLossen"), "startLadenLossen", "datetime-local"),
            stopField(i, t("vertrek"), "vertrek", "datetime-local")
          ]),
          el("div", { class: "row2" }, [
            stopPauzeField(i),
            stopField(i, t("kmstand"), "kmStand", "number")
          ]),
          stopField(i, t("opmerkingen"), "opmerkingen")
        ]));
      });
      stopCards.push(el("button", { type: "button", class: "btn-add", onclick: addStop }, [t("stopToevoegen")]));
      app.appendChild(el("div", { class: "card" }, stopCards));

      // --- Bijzonderheden card ---
      app.appendChild(el("div", { class: "card" }, [
        el("h2", null, [t("bijzonderheden")]),
        el("div", { class: "field" }, [
          el("textarea", {
            value: state.header.bijzonderheden,
            placeholder: t("p_bijzonderheden"),
            oninput: function (e) { state.header.bijzonderheden = e.target.value; }
          })
        ])
      ]));

      // --- Submit + download ---
      app.appendChild(el("button", {
        class: "btn-submit",
        disabled: state.submitting ? "disabled" : null,
        onclick: submit
      }, [ state.submitting ? t("bezigVerzenden") : t("verzenden") ]));

      app.appendChild(el("button", {
        class: "btn-secondary",
        onclick: function () { downloadPdf(null); }
      }, [ t("downloadPdf") ]));

      // Small reminder that the PDF is always Dutch.
      app.appendChild(el("div", { class: "pdf-note" }, [ t("pdfNote") ]));
    }

    function radio(key, val, labelText) {
      // `val` is the stored (Dutch) value used by the PDF logic ("Ja"/"Nee").
      // `labelText` is what the driver sees, translated.
      return el("label", null, [
        el("input", {
          type: "radio", name: key,
          checked: state.header[key] === val,
          onchange: function () { state.header[key] = val; }
        }),
        (labelText != null ? labelText : val)
      ]);
    }

    function stopField(i, label, key, type) {
      return el("div", { class: "field" }, [
        el("label", null, [label]),
        el("input", {
          type: type || "text",
          value: state.stops[i][key] || "",
          oninput: function (e) { state.stops[i][key] = e.target.value; }
        })
      ]);
    }

    // Pauze as two number boxes (Uren / Minuten), stored back as "HH:MM".
    function pauzeField() {
      var parts = (state.header.pauze || "").split(":");
      var hrs = parts.length === 2 ? parts[0] : "";
      var mins = parts.length === 2 ? parts[1] : "";

      function commit(newHrs, newMins) {
        var hNum = newHrs === "" ? 0 : parseInt(newHrs, 10) || 0;
        var mNum = newMins === "" ? 0 : parseInt(newMins, 10) || 0;
        if (newHrs === "" && newMins === "") { state.header.pauze = ""; }
        else { state.header.pauze = String(hNum).padStart(2, "0") + ":" + String(mNum).padStart(2, "0"); }
        updateComputed();
      }

      var hourBox = el("div", null, [
        el("input", {
          type: "number", min: "0", max: "23", value: hrs, placeholder: "0",
          oninput: function (e) { hrs = e.target.value; commit(hrs, mins); }
        }),
        el("span", { class: "sublabel" }, [t("uren")])
      ]);
      var minBox = el("div", null, [
        el("input", {
          type: "number", min: "0", max: "59", value: mins, placeholder: "0",
          oninput: function (e) { mins = e.target.value; commit(hrs, mins); }
        }),
        el("span", { class: "sublabel" }, [t("minuten")])
      ]);

      return el("div", { class: "field" }, [
        el("label", null, [t("pauze")]),
        el("div", { class: "row2" }, [ hourBox, minBox ])
      ]);
    }

    // Stop Pauze as two number boxes (Uren / Minuten), stored back as "HH:MM".
    function stopPauzeField(i) {
      var parts = (state.stops[i].pauze || "").split(":");
      var hrs = parts.length === 2 ? parts[0] : "";
      var mins = parts.length === 2 ? parts[1] : "";

      function commit(newHrs, newMins) {
        var hNum = newHrs === "" ? 0 : parseInt(newHrs, 10) || 0;
        var mNum = newMins === "" ? 0 : parseInt(newMins, 10) || 0;
        if (newHrs === "" && newMins === "") { state.stops[i].pauze = ""; }
        else { state.stops[i].pauze = String(hNum).padStart(2, "0") + ":" + String(mNum).padStart(2, "0"); }
      }

      var hourBox = el("div", null, [
        el("input", {
          type: "number", min: "0", max: "23", value: hrs, placeholder: "0",
          oninput: function (e) { hrs = e.target.value; commit(hrs, mins); }
        }),
        el("span", { class: "sublabel" }, [t("uren")])
      ]);
      var minBox = el("div", null, [
        el("input", {
          type: "number", min: "0", max: "59", value: mins, placeholder: "0",
          oninput: function (e) { mins = e.target.value; commit(hrs, mins); }
        }),
        el("span", { class: "sublabel" }, [t("minuten")])
      ]);

      return el("div", { class: "field" }, [
        el("label", null, [t("pauze")]),
        el("div", { class: "row2" }, [ hourBox, minBox ])
      ]);
    }

    // =====================================================================
    // PDF GENERATION — ALWAYS IN DUTCH.
    // All strings below are hard-coded Dutch on purpose. The driver's chosen
    // interface language does NOT affect the PDF; the office always receives a
    // Dutch Simon Loos sheet.
    // Runs entirely in the browser via jsPDF (loaded from the CDN above).
    // =====================================================================
    function downloadPdf(snapshot) {
      if (!snapshot) { snapshot = { header: state.header, stops: state.stops }; }
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert("PDF-bibliotheek nog niet geladen. Controleer je internet en probeer opnieuw.");
        return;
      }
      var jsPDF = window.jspdf.jsPDF;
      var hdr = snapshot.header;
      var stops = snapshot.stops || [];

      // US Letter landscape (matches the official Simon Loos sheet: 279.4 x 215.9 mm).
      var doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "letter" });
      var pageW = doc.internal.pageSize.getWidth();   // ~279.4
      var pageH = doc.internal.pageSize.getHeight();  // ~215.9
      var margin = 6;
      var x = margin;
      var right = pageW - margin;
      var contentW = right - x;

      doc.setLineWidth(0.2);
      doc.setDrawColor(0);

      var uren = computeUren(hdr.begintijd, hdr.eindtijd, hdr.pauze);
      var kmTot = computeKm(hdr.kmBegin, hdr.kmEind);

      // ---------- Title (centered over the left block only) ----------
      var titleCenter = x + 90;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.text("svp compleet in te vullen door chauffeur", titleCenter, margin + 3, { align: "center" });
      doc.setFontSize(7);
      doc.text("svp palletbon niet vergeten", titleCenter, margin + 6.5, { align: "center" });

      // ---------- Top block geometry ----------
      // Left side: 6 labelled rows. Right side: 3 columns (Diensttijd / Kilometers /
      // admin), each with its own group header and 5 value rows.
      var blockTop = margin + 14;
      var rowH = 6.6;
      var nLeftRows = 6;
      var nRightRows = 5;
      var leftBlockH = nLeftRows * rowH;

      var labelW = 46;                 // "Personeelsnummer:" etc.
      var valW = 40;                   // value cell for the left rows
      var kentW = 30;                  // Kenteken / Tablet-boco column
      var leftBlockRight = x + labelW + valW + kentW;

      var dienstLabelW = 20, dienstValW = 22;
      var dienstW = dienstLabelW + dienstValW;
      var colDienst = leftBlockRight + 1;

      var kmLabelW = 22, kmValW = 22;
      var kmW = kmLabelW + kmValW;
      var colKm = colDienst + dienstW + 1;

      var colAdmin = colKm + kmW + 1;
      var adminW = right - colAdmin;

      // ---------- Column group headers ----------
      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      doc.text("Diensttijd", colDienst + dienstW / 2, blockTop - 2, { align: "center" });
      doc.text("Kilometers", colKm + kmW / 2, blockTop - 2, { align: "center" });
      doc.setFontSize(7.5);
      doc.text("In te vullen door S.Loos admin", colAdmin + adminW / 2, blockTop - 2, { align: "center" });

      // ---------- Left labelled rows (6) ----------
      var leftLabels = [
        "Charter / subco:", "Datum:", "Naam chauffeur:",
        "Personeelsnummer:", "Trailernr:", "Trailer nr:"
      ];
      var leftValues = [
        hdr.charterSubco, hdr.datum, hdr.chauffeur,
        hdr.personeelsnummer, hdr.trailernr, hdr.simonLoosTrailerNr
      ];
      doc.setFontSize(8.5);
      for (var i = 0; i < nLeftRows; i++) {
        var ry = blockTop + i * rowH;
        doc.rect(x, ry, labelW, rowH);          // label cell
        doc.rect(x + labelW, ry, valW, rowH);   // value cell
        doc.setFont("helvetica", "normal");
        doc.text(leftLabels[i], x + labelW - 1.5, ry + 4.4, { align: "right" });
        if (leftValues[i]) {
          doc.setFont("helvetica", "bold");
          doc.text(String(leftValues[i]), x + labelW + 1.5, ry + 4.4);
        }
      }
      // "Simon Loos" caption on the last row's label cell (as on the paper)
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.text("Simon Loos", x + 1.5, blockTop + (nLeftRows - 1) * rowH + 4.4);

      // ---------- Kenteken + Tablet/boco column ----------
      var kentColX = x + labelW + valW;
      // Kenteken spans the top 3 rows; Tablet/boco spans the bottom 3.
      doc.rect(kentColX, blockTop, kentW, rowH * 3);
      doc.rect(kentColX, blockTop + rowH * 3, kentW, rowH * 3);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.text("Kenteken", kentColX + kentW / 2, blockTop + 4.4, { align: "center" });
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text(String(hdr.kenteken || ""), kentColX + kentW / 2, blockTop + rowH + 4, { align: "center" });
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.text("Tablet/boco", kentColX + kentW / 2, blockTop + rowH * 3 + 4.4, { align: "center" });
      var tb = (hdr.tabletBoco || "");
      doc.setFont("helvetica", tb === "Ja" ? "bold" : "normal");
      var jaMark = tb === "Ja" ? "\u25CF Ja" : "\u25CB Ja";
      doc.setFont("helvetica", "normal");
      var line = (tb === "Ja" ? "[X] Ja  /  nee" : (tb === "Nee" ? "Ja  /  [X] nee" : "Ja  /  nee"));
      doc.setFontSize(9);
      doc.text(line, kentColX + kentW / 2, blockTop + rowH * 4 + 4, { align: "center" });

      // ---------- Diensttijd / Kilometers / Admin labelled boxes (5 rows each) ----------
      function labelledBox(cx, lw, vw, rows) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        for (var j = 0; j < rows.length; j++) {
          var by = blockTop + j * rowH;
          doc.rect(cx, by, lw, rowH);
          doc.rect(cx + lw, by, vw, rowH);
          doc.text(String(rows[j][0]), cx + 1.2, by + 4.4);
          if (rows[j][1] !== "" && rows[j][1] != null) {
            doc.setFont("helvetica", "bold");
            doc.text(String(rows[j][1]), cx + lw + vw - 1.2, by + 4.4, { align: "right" });
            doc.setFont("helvetica", "normal");
          }
        }
      }

      labelledBox(colDienst, dienstLabelW, dienstValW, [
        ["Begintijd", timePart(hdr.begintijd)],
        ["Eindtijd", timePart(hdr.eindtijd)],
        ["bruto uren", uren.bruto],
        ["pauze", hdr.pauze],
        ["netto uren", uren.netto]
      ]);

      labelledBox(colKm, kmLabelW, kmValW, [
        ["KM eind", hdr.kmEind],
        ["KM begin", hdr.kmBegin],
        ["KM totaal", kmTot],
        ["Tolkosten", hdr.tolkosten],
        ["kosten overig", hdr.kostenOverig]
      ]);

      // Admin column (labels + shaded blank value cells with a ":" like the paper)
      var adminLabelW = 22;
      var adminValW = adminW - adminLabelW;
      var adminRows = ["Begintijd", "Eindtijd", "bruto uren", "pauze", "netto uren"];
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      for (var a = 0; a < nRightRows; a++) {
        var ay = blockTop + a * rowH;
        doc.rect(colAdmin, ay, adminLabelW, rowH);
        doc.setFillColor(224, 224, 224);
        doc.rect(colAdmin + adminLabelW, ay, adminValW, rowH, "FD");
        doc.text(adminRows[a], colAdmin + 1.2, ay + 4.4);
        doc.text(":", colAdmin + adminLabelW + 4, ay + 4.4);
      }

      var blockBottom = blockTop + leftBlockH;

      // ---------- Stops table ----------
      var tableTop = blockBottom + 1.5;
      var cols = [
        { key: "twNr",            title: "TW. nr",            w: 26 },
        { key: "laadLosLocatie",  title: "Laad-/loslocatie",  w: 78 },
        { key: "aankomst",        title: "Aankomst",          w: 20 },
        { key: "startLadenLossen",title: "Start Laden/Lossen",w: 22 },
        { key: "vertrek",         title: "Vertrek",           w: 20 },
        { key: "pauze",           title: "Pauze",             w: 18 },
        { key: "kmStand",         title: "KMstand",           w: 22 },
        { key: "opmerkingen",     title: "opmerkingen",       w: 0 }   // fill remainder
      ];
      // compute the "fill remainder" column width
      var used = 0;
      for (var cw0 = 0; cw0 < cols.length; cw0++) used += cols[cw0].w;
      cols[cols.length - 1].w = contentW - used;

      // Header row
      var headerH = 8;
      var cx = x;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      for (var c = 0; c < cols.length; c++) {
        doc.rect(cx, tableTop, cols[c].w, headerH);
        // wrap "Start Laden/Lossen" onto two lines like the paper
        if (cols[c].key === "startLadenLossen") {
          doc.setFontSize(7.5);
          doc.text("Start", cx + cols[c].w / 2, tableTop + 3.4, { align: "center" });
          doc.text("Laden/Lossen", cx + cols[c].w / 2, tableTop + 6.4, { align: "center" });
          doc.setFontSize(8);
        } else {
          doc.text(cols[c].title, cx + cols[c].w / 2, tableTop + 5, { align: "center" });
        }
        cx += cols[c].w;
      }

      // Data rows — official sheet has 20 rows.
      var totalRows = 20;
      var yb = tableTop + headerH;
      var dataH = 6.2;
      doc.setFontSize(8);
      for (var r = 0; r < totalRows; r++) {
        cx = x;
        var stop = stops[r] || {};
        var ry3 = yb + r * dataH;
        for (var cc = 0; cc < cols.length; cc++) {
          doc.rect(cx, ry3, cols[cc].w, dataH);
          var key3 = cols[cc].key;
          var val = stop[key3];
          if (val) {
            if (key3 === "aankomst" || key3 === "startLadenLossen" || key3 === "vertrek") {
              val = timePart(val);
            }
            var txt = String(val);
            var maxChars = Math.floor(cols[cc].w / 1.5);
            if (txt.length > maxChars) txt = txt.slice(0, maxChars - 1) + "\u2026";
            doc.text(txt, cx + 1.2, ry3 + 4.2);
          } else if (key3 === "aankomst" || key3 === "startLadenLossen" || key3 === "vertrek" || key3 === "pauze") {
            // print a faint ":" placeholder like the blank paper form
            doc.setTextColor(150);
            doc.text(":", cx + cols[cc].w / 2, ry3 + 4.2, { align: "center" });
            doc.setTextColor(0);
          }
          cx += cols[cc].w;
        }
      }

      // ---------- Bijzonderheden + logo ----------
      var bijzTop = yb + totalRows * dataH + 1.5;
      var bijzH = pageH - margin - bijzTop;
      if (bijzH < 16) bijzH = 16;
      // Box spans from left to where the logo area begins
      var logoW = 47.5, logoH = 17.7;
      var logoX = right - logoW;
      var logoY = pageH - margin - logoH;
      var bijzBoxW = logoX - x - 2;

      doc.rect(x, bijzTop, bijzBoxW, bijzH);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.text("Bijzonderheden", x + 2, bijzTop + bijzH / 2 + 1);

      // Three writing lines (like the real sheet), starting to the right of the label.
      var linesX = x + 34;
      var linesRight = x + bijzBoxW - 4;
      var nLines = 3;
      var lineGap = bijzH / (nLines + 1);
      doc.setLineWidth(0.15);
      var lineYs = [];
      for (var li = 1; li <= nLines; li++) {
        var ly = bijzTop + lineGap * li;
        doc.line(linesX, ly, linesRight, ly);
        lineYs.push(ly);
      }
      doc.setLineWidth(0.2);

      // Place the driver's text on the lines (wrapped, one segment per line).
      var bijz = hdr.bijzonderheden || "";
      if (bijz) {
        doc.setFontSize(8);
        var wrapped = doc.splitTextToSize(bijz, linesRight - linesX);
        for (var wl = 0; wl < wrapped.length && wl < nLines; wl++) {
          doc.text(wrapped[wl], linesX, lineYs[wl] - 1.2);
        }
      }

      // Logo bottom-right
      try {
        doc.addImage(SIMON_LOOS_LOGO, "PNG", logoX, logoY, logoW, logoH);
      } catch (e) { /* if logo fails, silently skip */ }

      // ---------- Filename ----------
      var safeName = (hdr.chauffeur || "chauffeur").replace(/[^a-z0-9]+/gi, "_");
      var fname = "Dagstaat_" + safeName + "_" + (hdr.datum || "") + ".pdf";
      doc.save(fname);
    }

    // Recalculate the green computed boxes without a full re-render
    // (keeps focus in the field the driver is typing in).
    function updateComputed() {
      var uren = computeUren(state.header.begintijd, state.header.eindtijd, state.header.pauze);
      var urenBox = document.getElementById("urenBox");
      if (urenBox) urenBox.textContent = t("brutoUren") + ": " + (uren.bruto || "-") + "  |  " + t("nettoUren") + ": " + (uren.netto || "-");
      var kmTot = computeKm(state.header.kmBegin, state.header.kmEind);
      var kmBox = document.getElementById("kmBox");
      if (kmBox) kmBox.textContent = t("kmTotaal") + ": " + kmTot;
    }

    render();
  </script>
</body>
</html>
